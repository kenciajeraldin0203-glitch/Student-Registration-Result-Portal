<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration & Result Portal</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">
                🎓 Student Registration & Result Portal
            </span>
        </div>
    </nav>


    <!-- Main Container -->
    <div class="container my-5">

        <!-- Registration Card -->
        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Student Registration</h4>
            </div>

            <div class="card-body">

                <form id="studentForm">

                    <!-- Student Details -->
                    <h5 class="section-title">Student Details</h5>

                    <div class="row">

                        <!-- Name -->
                        <div class="col-md-6 mb-3">
                            <label for="studentName" class="form-label">
                                Student Name
                            </label>

                            <input
                                type="text"
                                id="studentName"
                                class="form-control"
                                placeholder="Enter student name">
                        </div>


                        <!-- Register Number -->
                        <div class="col-md-6 mb-3">
                            <label for="registerNumber" class="form-label">
                                Register Number
                            </label>

                            <input
                                type="text"
                                id="registerNumber"
                                class="form-control"
                                placeholder="Enter register number">
                        </div>


                        <!-- Email -->
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter email">
                        </div>


                        <!-- Course -->
                        <div class="col-md-6 mb-3">
                            <label for="course" class="form-label">
                                Course
                            </label>

                            <select id="course" class="form-select">

                                <option value="">
                                    Select Course
                                </option>

                                <option value="B.Tech AI & Data Science">
                                    B.Tech AI & Data Science
                                </option>

                                <option value="B.Tech Computer Science">
                                    B.Tech Computer Science
                                </option>

                                <option value="B.Tech Information Technology">
                                    B.Tech Information Technology
                                </option>

                                <option value="B.Tech Electronics & Communication">
                                    B.Tech Electronics & Communication
                                </option>

                            </select>
                        </div>

                    </div>


                    <!-- Marks -->
                    <h5 class="section-title mt-4">
                        Examination Marks
                    </h5>

                    <div class="row">

                        <!-- Subject 1 -->
                        <div class="col-md-4 mb-3">

                            <label for="mark1" class="form-label">
                                Subject 1
                            </label>

                            <input
                                type="number"
                                id="mark1"
                                class="form-control"
                                min="0"
                                max="100"
                                placeholder="Enter marks">

                        </div>


                        <!-- Subject 2 -->
                        <div class="col-md-4 mb-3">

                            <label for="mark2" class="form-label">
                                Subject 2
                            </label>

                            <input
                                type="number"
                                id="mark2"
                                class="form-control"
                                min="0"
                                max="100"
                                placeholder="Enter marks">

                        </div>


                        <!-- Subject 3 -->
                        <div class="col-md-4 mb-3">

                            <label for="mark3" class="form-label">
                                Subject 3
                            </label>

                            <input
                                type="number"
                                id="mark3"
                                class="form-control"
                                min="0"
                                max="100"
                                placeholder="Enter marks">

                        </div>

                    </div>


                    <!-- Buttons -->
                    <div class="mt-3">

                        <button
                            type="submit"
                            class="btn btn-primary">
                            Calculate Result
                        </button>

                        <button
                            type="reset"
                            class="btn btn-secondary"
                            id="clearButton">
                            Clear
                        </button>

                    </div>

                </form>

            </div>
        </div>


        <!-- Result Section -->
        <div
            id="resultSection"
            class="card shadow mt-5 d-none">

            <div class="card-header bg-success text-white">

                <h4 class="mb-0">
                    Student Result
                </h4>

            </div>


            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered">

                        <tbody>

                            <tr>
                                <th>Student Name</th>
                                <td id="displayName"></td>
                            </tr>

                            <tr>
                                <th>Register Number</th>
                                <td id="displayRegister"></td>
                            </tr>

                            <tr>
                                <th>Email</th>
                                <td id="displayEmail"></td>
                            </tr>

                            <tr>
                                <th>Course</th>
                                <td id="displayCourse"></td>
                            </tr>

                            <tr>
                                <th>Subject 1</th>
                                <td id="displayMark1"></td>
                            </tr>

                            <tr>
                                <th>Subject 2</th>
                                <td id="displayMark2"></td>
                            </tr>

                            <tr>
                                <th>Subject 3</th>
                                <td id="displayMark3"></td>
                            </tr>

                            <tr>
                                <th>Total Marks</th>
                                <td id="displayTotal"></td>
                            </tr>

                            <tr>
                                <th>Percentage</th>
                                <td id="displayPercentage"></td>
                            </tr>

                            <tr>
                                <th>Result</th>
                                <td>
                                    <span id="displayResult"
                                          class="badge">
                                    </span>
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">

        <p class="mb-0">
            Student Registration & Result Portal
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
